<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Care Hut | Adoption</title>

  <!-- CSS Files -->
  <link rel="stylesheet" href="css/adoption.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css"
    integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO"
    crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css?family=Baloo+Bhai|Bree+Serif&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
  <div class="error">
    <p>Error!<br>Can't display due to low screen resolution.</p>
  </div>

  <div class="main">
    <!-- Navbar -->
    <nav id="navbar">
      <img src="images/carehutlogo.jpg" alt="Care Hut Logo">
      <ul>
        <li><a href="carehut.html"><i class="fas fa-arrow-left"></i> Back to Home</a></li>
      </ul>
    </nav>

    <!-- Main Section -->
    <section id="home">
      <h2 class="h-Secondary"><i class="fas fa-paw"></i> Adoption Centers Near You</h2>
      <div id="map"></div>

      <!-- Adoption Centers Table -->
      <div class="table-responsive">
        <table class="table table-hover">
          <thead class="thead-dark">
            <tr>
              <th scope="col"><i class="fas fa-store"></i> Center Name</th>
              <th scope="col"><i class="fas fa-map-marker-alt"></i> Address</th>
              <th scope="col"><i class="fas fa-star"></i> Rating</th>
              <th scope="col"><i class="fas fa-link"></i> Links</th>
            </tr>
          </thead>
          <tbody id="table_body">
            <tr>
              <td colspan="4" class="loading-message">
                <i class="fas fa-spinner fa-spin"></i> Finding adoption centers near you...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

    <!-- Footer -->
    <footer id="conc">
      This is a demo website created solely for demonstration purposes.<br>
      Copyright &copy; www.carehut.com. All rights reserved!<br>
    </footer>
  </div>

  <!-- Dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/axios@1.1.2/dist/axios.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>

  <!-- Your JS must load BEFORE Google Maps calls initMap -->
  <script src="javascripts/adoption.js"></script>

  <!-- Google Maps API (with correct callback and async loading) -->
  <script async defer
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCmuDT47gS7uMw4H4HYkkHegAd9LZ8Ux-4&libraries=places,marker&v=weekly&callback=initMap">
  </script>
</body>

</html>
